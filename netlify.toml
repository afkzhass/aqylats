# ============================================================
# netlify.toml — Aqyl ATS (React + Vite + Supabase)
# Репозиторий: github.com/afkzhass/aqylats
# ============================================================

[build]
  # Команда сборки
  command = "npm run build"
  # Папка с готовым билдом Vite
  publish = "dist"
  # Папка для кэша node_modules между деплоями
  base = "."

[build.environment]
  # Node.js версия (совместима с Vite 5 + TypeScript 5)
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ============================================================
# SPA Redirect — обязательно для React Router
# Без этого при обновлении страницы любой маршрут кроме /
# вернёт 404 от Netlify
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# Security Headers
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Кэшируем статические ассеты Vite (хэшированные имена файлов)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Не кэшируем index.html — чтобы новые деплои подхватывались сразу
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
